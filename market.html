<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:;">
  <title>Bigfish 插件市场</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel2: #1e222b;
      --border: #2a2f3a;
      --text: #e8eaf0;
      --text-dim: #9aa3b2;
      --accent: #4f8ef7;
      --accent2: #37b6a8;
      --danger: #e5534b;
      --ok: #3fb950;
      --radius: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 14px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      padding: 14px 20px 10px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      flex-shrink: 0;
    }
    .head-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    h1 { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    h1 .logo { font-size: 20px; }
    .sub { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
    .spacer { flex: 1; }
    input[type=search] {
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 7px 12px;
      width: 260px;
      outline: none;
    }
    input[type=search]:focus { border-color: var(--accent); }
    .btn {
      background: var(--panel2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 7px 14px;
      cursor: pointer;
      font-size: 13px;
      transition: background .15s;
    }
    .btn:hover { background: #262c38; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { background: #3f7ce4; }
    .btn.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
    .btn.danger:hover { background: rgba(229,83,75,.12); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .tabs { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .tab {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-dim);
      border-radius: 999px;
      padding: 5px 14px;
      cursor: pointer;
      font-size: 13px;
    }
    .tab:hover { color: var(--text); background: var(--panel2); }
    .tab.active { background: var(--panel2); color: var(--accent); border-color: var(--border); font-weight: 600; }
    .status-line { margin-top: 8px; font-size: 12px; color: var(--text-dim); display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
    .status-line .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
    .dot.online { background: var(--ok); }
    .dot.local { background: #d29922; }
    .dot.none { background: var(--danger); }
    main { flex: 1; overflow-y: auto; padding: 16px 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 14px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color .15s;
    }
    .card:hover { border-color: #3a4150; }
    .card-head { display: flex; align-items: flex-start; gap: 10px; }
    .card-icon {
      width: 44px; height: 44px; border-radius: 10px;
      background: var(--panel2);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
      border: 1px solid var(--border);
    }
    .card-title { font-size: 15px; font-weight: 600; }
    .card-meta { color: var(--text-dim); font-size: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .badge {
      display: inline-block; padding: 1px 8px; border-radius: 999px;
      font-size: 11px; border: 1px solid var(--border); color: var(--text-dim);
    }
    .badge.official { color: #7ab0ff; border-color: #2d4a7a; background: rgba(79,142,247,.1); }
    .badge.builtin { color: #4cd4c3; border-color: #1f5f58; background: rgba(55,182,168,.1); }
    .badge.github { color: #d29922; border-color: #6b5415; background: rgba(210,153,34,.08); }
    .card-desc { color: var(--text-dim); font-size: 13px; min-height: 42px; }
    .card-foot { display: flex; align-items: center; gap: 8px; margin-top: auto; }
    .installed-tag { color: var(--ok); font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
    .card-foot .spacer { flex: 1; }
    .empty { text-align: center; color: var(--text-dim); padding: 60px 0; }
    .toast-wrap { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; z-index: 50; }
    .toast {
      background: var(--panel2); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 18px; font-size: 13px;
      box-shadow: 0 6px 24px rgba(0,0,0,.45);
      max-width: 520px;
    }
    .toast.ok { border-color: #1f5f58; color: #7ee787; }
    .toast.err { border-color: #6b241f; color: #ffa198; }
    .toast .t-actions { margin-top: 8px; display: flex; gap: 8px; }
    .toast code { background: rgba(255,255,255,.07); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
    .modal-mask {
      position: fixed; inset: 0; background: rgba(0,0,0,.55);
      display: none; align-items: center; justify-content: center; z-index: 40;
    }
    .modal-mask.show { display: flex; }
    .modal {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 14px; padding: 22px 26px; width: 480px; max-width: 92vw;
    }
    .modal h2 { font-size: 16px; margin-bottom: 10px; }
    .modal .m-body { color: var(--text-dim); font-size: 13px; max-height: 240px; overflow-y: auto; }
    .modal .m-actions { margin-top: 18px; display: flex; justify-content: flex-end; gap: 10px; }
    .modal .m-actions .btn { min-width: 90px; }
    footer { flex-shrink: 0; padding: 8px 20px; border-top: 1px solid var(--border); color: var(--text-dim); font-size: 12px; display: flex; gap: 16px; align-items: center; }
    footer a { color: var(--accent); cursor: pointer; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
    .spinner {
      width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.25);
      border-top-color: #fff; border-radius: 50%;
      animation: spin .7s linear infinite; display: inline-block; vertical-align: -2px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
    pre.errbox { white-space: pre-wrap; word-break: break-all; font-size: 12px; color: #ffa198; }
  </style>
</head>
<body>
  <header>
    <div class="head-row">
      <h1><span class="logo">🐳</span> Bigfish 插件市场</h1>
      <span class="spacer"></span>
      <input type="search" id="search" placeholder="搜索插件（名称 / 作者 / 描述）…">
      <button class="btn" id="refresh">刷新</button>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="status-line">
      <span><span class="dot" id="src-dot"></span><span id="src-text">加载中…</span></span>
      <span id="count-text"></span>
      <span id="installed-count"></span>
    </div>
  </header>

  <main>
    <div class="grid" id="grid"></div>
    <div class="empty hidden" id="empty">没有找到匹配的插件</div>
  </main>

  <footer>
    <span>插件来自 DeepSeek Harness 社区（DSH 官方插件体系），安装后重启生效。</span>
    <span class="spacer"></span>
    <a id="link-profile">查看插件目录</a>
    <a id="link-repo">开源协议与致谢</a>
  </footer>

  <div class="modal-mask" id="modal-mask">
    <div class="modal">
      <h2 id="m-title"></h2>
      <div class="m-body" id="m-body"></div>
      <div class="m-actions">
        <button class="btn" id="m-cancel">取消</button>
        <button class="btn primary" id="m-ok">确定</button>
      </div>
    </div>
  </div>

  <div class="toast-wrap" id="toasts"></div>

  <script src="market.js"></script>
</body>
</html>
