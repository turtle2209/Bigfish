<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0; padding: 0;
      background: transparent;
      overflow: hidden;
      user-select: none;
      cursor: grab;
    }
    #pet-wrap {
      position: absolute;
      /* left/top set via JS */
    }
    #pet-inner {
      width: 180px; height: 200px;
      position: relative;
      transform-origin: center center;
    }
    #bubble {
      position: absolute; top: 2px; left: 50%;
      transform: translateX(-50%);
      background: #fff; color: #333;
      padding: 6px 11px; border-radius: 12px;
      font-size: 12px; line-height: 1.4;
      max-width: 196px; text-align: center;
      display: none;
      box-shadow: 0 2px 10px rgba(0,0,0,.28);
      word-break: break-all;
      z-index: 2;
    }
    #bubble.show { display: block; animation: pop .18s ease-out; }
    #pet {
      position: absolute; bottom: 4px; left: 50%;
      transform: translateX(-50%);
      height: 158px;
      pointer-events: none;
    }
    #pet.animate-bob { animation: bob 3.2s ease-in-out infinite; }
    @keyframes bob {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-7px); }
    }
    @keyframes pop {
      from { transform: translateX(-50%) scale(.82); opacity: 0; }
      to   { transform: translateX(-50%) scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="pet-wrap">
    <div id="pet-inner">
      <div id="bubble"></div>
      <img id="pet" draggable="false" alt="">
    </div>
  </div>
  <script src="pet.js"></script>
</body>
</html>
